<!--
login.html
-----------
Owner: Person 3 (design) — reads data prepared by Person 1's login() route

PLACEHOLDER — replace with a styled login form. Keep the <form> action,
method, and input "name" attributes exactly as they are (Person 1's route
reads request.form["username"] / request.form["password"]).
-->
{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content
%}
<h1 class="text-2xl">Login</h1>
<form
  class="flex flex-col gap-3 max-w-sm mt-4"
  method="POST"
  action="{{ url_for('auth.login') }}"
>
  <label>Username</label>
  <input class="border rounded-md p-2" type="text" name="username" required />

  <label>Password</label>
  <input
    class="border rounded-md p-2"
    type="password"
    name="password"
    required
  />

  <button
    class="bg-blue-800 text-white font-semibold px-4 py-2 rounded-lg"
    type="submit"
  >
    Log In
  </button>
</form>
<p>
  No account?
  <a class="text-blue-800" href="{{ url_for('auth.register') }}">Register</a>
</p>
{% endblock %}
