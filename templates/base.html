 so this is the single place that controls the

TASK FOR PERSON 3:
    1. Add the Tailwind CDN script tag in <head>
    2. Design a simple top navbar (logo/name + "Dashboard" + "Logout" links)
    3. Keep the  block - that's where each page's own

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}Trello Clone{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="flex items-center justify-between px-8 py-4">
      <strong class="text-2xl font-semibold">Tarmo</strong>
      <nav class="flex items-center gap-8">
        <a href="{{ url_for('boards.dashboard') }}">Dashboard</a>
      </nav>
      <a href="{{ url_for('auth.logout') }}">Logout</a>
    </header>

    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
