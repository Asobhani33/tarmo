<!--
register.html
--------------
Owner: Person 3 (design) — reads data prepared by Person 1's register() route

PLACEHOLDER — keep the form action/method/input names as-is.
-->
{% extends "base.html" %} {% block title %}Register{% endblock %} {% block
content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">

  <div class="w-full max-w-[380px] rounded-2xl bg-gradient-to-br from-[#DCE7F8] via-[#D5E7F8] to-[#D1F0F0] p-6 shadow-sm flex flex-col items-center">

    <h1 class="text-xl font-semibold text-slate-800 mb-4">Register</h1>

    <form
      class="flex flex-col gap-2 w-full items-center"
      method="POST"
action="{{ url_for('auth.register') }}"    >
      <input
        class="w-[85%] rounded-xl border border-white/80 bg-white/75 px-4 py-1.5 text-sm text-slate-800 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-sky-300"
        type="text"
        name="username"
        placeholder="Username"
        required
      />

      <input
        class="w-[85%] rounded-xl border border-white/80 bg-white/75 px-4 py-1.5 text-sm text-slate-800 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-sky-300"
        type="email"
        name="email"
        placeholder="Email"
        required
      />

      <input
        class="w-[85%] rounded-xl border border-white/80 bg-white/75 px-4 py-1.5 text-sm text-slate-800 placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-sky-300"
        type="password"
        name="password"
        placeholder="Password"
        required
      />

      <button
        class="w-[85%] mt-4 rounded-xl text-center text-sm font-semibold text-slate-800 px-4 py-1.5 bg-gradient-to-r from-[#8FC8E8] to-[#9AA8EA] hover:from-[#7FBCE2] hover:to-[#8A99E4] transition"
        type="submit"
      >
        Register
      </button>
    </form>

    <p class="mt-4 text-sm text-slate-600">
      
Already have an account?
<a class="font-medium text-[#003f8a] hover:text-[#0072e5] transition" href="{{ url_for('auth.login') }}">Login</a>    </p>

  </div>
</div>
{% endblock %}
