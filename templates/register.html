{% extends "base.html" %} {% block title %}Register{% endblock %} {% block
content %}
<h1 class="text-2xl">Register</h1>
<form
  class="flex flex-col gap-3 max-w-sm mt-4"
  method="POST"
  action="{{ url_for('auth.register') }}"
>
  <label>Username</label>
  <input class="border rounded-md p-2" type="text" name="username" required />

  <label>Password</label>
  <input
    class="border rounded-md p-2"
    type="password"
    name="password"
    required
  />

  <button
    class="bg-blue-800 text-white py-2 rounded font-semibold"
    type="submit"
  >
    Register
  </button>
</form>
<p class="mt-2">
  Already have an account?
  <a class="text-blue-800" href="{{ url_for('auth.login') }}">Login</a>
</p>
{% endblock %}
