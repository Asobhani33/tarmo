<!--
dashboard.html
---------------
Owner: Person 3 (design) — shows boards prepared by Person 1's dashboard() route

PLACEHOLDER — `boards` is a list of board documents from Mongo, each with
a "name" and "_id". Loop over them and link each to its board page.
-->
{% extends "base.html" %} {% block title %}Dashboard{% endblock %} {% block
content %}
<h1 class="text-2xl font-bold mb-6">Your Boards</h1>
<p class="font-medium mb-2">Create a new board</p>
<form
  class="flex gap-3 mb-8"
  method="POST"
  action="{{ url_for('boards.create_board') }}"
>
  <input
    class="border rounded px-3 py-2"
    type="text"
    name="name"
    placeholder="New board name"
    required
  />
  <button
    class="bg-blue-800 text-white px-4 py-2 rounded font-semibold hover:bg-blue-700 transition"
    type="submit"
  >
    Create Board
  </button>
</form>

<div class="flex flex-wrap gap-5">
  {% for board in boards %}

  <div
    class="w-72 bg-white border rounded-xl p-5 min-h-32 hover:shadow-lg hover:-translate-y-1 transition"
  >
    <a
      href="{{ url_for('boards.view_board', board_id=board._id) }}"
      class="text-lg font-semibold hover:text-blue-600"
    >
      {{ board.name }}
    </a>

    <p class="text-gray-500 mt-2">Board</p>
  </div>

  {% endfor %}
</div>
{% endblock %}
